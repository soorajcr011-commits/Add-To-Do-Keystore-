name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install asset generator
        run: npm install @capacitor/assets --save-dev

      - name: Generate native icons and splash
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Use persistent release signing key
        run: |
          cp keystore/release2.keystore android/app/release2.keystore
          cat >> android/app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release2.keystore")
                      storePassword "addtodowt2026"
                      keyAlias "addtodowtkey"
                      keyPassword "addtodowt2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: add-to-do-apk
          path: android/app/build/outputs/apk/release/app-release.apk
